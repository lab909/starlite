name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests, static analysis, assets, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # No lock file in the skeleton: this resolves the latest starlite/framework from GitHub,
      # so the skeleton is always tested against the current framework.
      - name: Install PHP dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies
        run: npm ci

      # Before the tests, so the ones that check built assets run too.
      - name: Build assets
        run: npm run build

      - name: Tests
        run: vendor/bin/phpunit

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # The real site in Chromium (tests/e2e): no CSP violations or errors on any page, Datastar,
      # theme, persistence, click-to-load videos, translated URLs, no-JavaScript fallbacks.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
